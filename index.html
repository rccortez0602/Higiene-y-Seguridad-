<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Higiene y Seguridad</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    padding:0;
}

.contenedor{
    text-align:center;
    padding:40px;
}

.btn{
    background:#0056b3;
    color:white;
    border:none;
    padding:12px 20px;
    cursor:pointer;
    border-radius:5px;
    margin:10px;
}

.btn:hover{
    background:#003d80;
}

.modal{
    display:none;
    position:fixed;
    z-index:1000;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
}

.modal-content{
    background:white;
    width:80%;
    max-width:600px;
    margin:10% auto;
    padding:20px;
    border-radius:10px;
    position:relative;
}

.cerrar{
    position:absolute;
    right:15px;
    top:10px;
    font-size:28px;
    cursor:pointer;
}
</style>

</head>
<body>

<div class="contenedor">
    <h1>Empresa de Higiene y Seguridad</h1>

    <button class="btn" onclick="abrirModal('modalServicios')">
        Servicios
    </button>

    <button class="btn" onclick="abrirModal('modalContacto')">
        Contacto
    </button>
</div>

<!-- MODAL SERVICIOS -->
<div id="modalServicios" class="modal">
    <div class="modal-content">
        <span class="cerrar" onclick="cerrarModal('modalServicios')">&times;</span>

        <h2>Nuestros Servicios</h2>

        <ul>
            <li>Capacitaciones en Seguridad e Higiene</li>
            <li>Evaluación de riesgos laborales</li>
            <li>Planes de emergencia</li>
            <li>Inspecciones y auditorías</li>
        </ul>
    </div>
</div>

<!-- MODAL CONTACTO -->
<div id="modalContacto" class="modal">
    <div class="modal-content">
        <span class="cerrar" onclick="cerrarModal('modalContacto')">&times;</span>

        <h2>Contacto</h2>

        <p>Email: contacto@empresa.com</p>
        <p>Teléfono: +54 9 2966 123456</p>
        <p>Río Gallegos - Santa Cruz</p>
    </div>
</div>

<script>
function abrirModal(id){
    document.getElementById(id).style.display = "block";
}

function cerrarModal(id){
    document.getElementById(id).style.display = "none";
}

window.onclick = function(event){
    document.querySelectorAll('.modal').forEach(modal => {
        if(event.target === modal){
            modal.style.display = "none";
        }
    });
}
</script>

</body>
</html>
